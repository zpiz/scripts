name: "NAS 下载监控小组件"
description: "实时显示 qBittorrent 的上下行速率、活动种子数与全局状态"
author: "Gemini"

compat_arguments:
  QB_URL:
  QB_USER:
  QB_PASS:
  
compat_arguments_schema:
  QB_URL:
#    name: "qb url"
    description: "输入qb url"
  QB_USER:
#    name: "qb管理账号"
    default_value: "admin"
    description: "输入qb账号"
  QB_PASS:
#    name: "qb管理账号密码"
    default_value: "azhu231!"
    description: "输入qb密码"

scriptings:
  - generic:
      name: "qb-monitor-script"
      script_url: "https://raw.githubusercontent.com/zpiz/scripts/refs/heads/main/Egern/qb-monitor.js"
      timeout: 10

widgets:
  - name: "qb-monitor-widget"
    script_name: "qb-monitor-script"
    env:
      QB_URL: "{{{QB_URL}}}"
      QB_USER: "{{{QB_USER}}}"
      QB_PASS: "{{{QB_PASS}}}"
