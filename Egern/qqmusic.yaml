name: "QQ音乐"
description: "登录获取 ck，定时签到；获取 ck 和定时任务均可单独关闭"
icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png"

compat_arguments:
  token_disabled: false
  cron: "11 10 * * *"

compat_arguments_schema:
  token_disabled:
    name: "禁用获取token"
    description: "禁用后关闭抓包获取token功能"
    options:
    - true
    - false
    default_value: false
  cron:
    name: "执行时间"
    description: "自定义任务执行时间"
    default_value: "11 10 * * *"
dns: {}

scriptings:
- http_request:
    name: QQ音乐 Cookie
    match: ^https:\/\/u6\.y\.qq\.com\/cgi-bin\/musics\.fcg\?.*EveryDaySignLvzScore
    script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js,img-url=https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/qqmusic.png
    max_size: 0
    body_required: false
    disabled: {{{token_disabled}}}
- schedule:
    name: QQ音乐签到
    cron: 20 9 * * *
    script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js,img-url=https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/qqmusic.png
    timeout: 60
mitm:
  hostnames:
    includes:
    - u6.y.qq.com
