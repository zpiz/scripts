name: "QQ音乐"
description: "登录获取 ck，定时签到；获取 ck 和定时任务均可单独关闭"
icon: "https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/qqmusic.png"

compat_arguments:
  token_disabled: false
  cron: "39 7 * * **"
  cron1: "* 9-10 * * *"
  cron2: "9 0,8,12,16,20,22 * * *"

compat_arguments_schema:
  token_disabled:
    name: "禁用获取token"
    description: "禁用后关闭抓包获取token功能"
    options:
    - true
    - false
    default_value: false
  cron:
    name: "执行时间"
    description: "自定义任务执行时间"
    default_value: "39 7 * * *"
  cron1:
    name: "金币任务执行时间"
    description: "自定义任务执行时间"
    default_value: "* 9-10 * * *"
  cron2:
    name: "红包雨执行时间"
    description: "自定义任务执行时间"
    default_value: "9 0,8,12,16,20,22 * * *"  
dns: {}

scriptings:
- http_request:
    name: QQ音乐 Cookie
    match: ^https:\/\/u6\.y\.qq\.com\/cgi-bin\/musics\.fcg\?.*(EveryDaySignLvzScore|GetSignInSummary)
    script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
    max_size: 0
    body_required: false
    disabled: {{{token_disabled}}}
- schedule:
    name: QQ音乐每日任务
    cron: {{{cron}}}
    script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
    timeout: 60
- schedule:
    name: QQ音乐定时金币
    cron: "{{{cron1}}}"
    script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
    timeout: 60
- schedule:
    name: QQ音乐红包雨
    cron: "{{{cron2}}}"
    script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
    timeout: 60
        
mitm:
  hostnames:
    includes:
    - u6.y.qq.com
